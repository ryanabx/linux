%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/mediatek,mt8173-mt6391.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT8173 with the MT6391 PMIC audio codec

maintainers:
  - Ryan Brue <ryanbrue.dev@gmail.com>

description:
  Sound card for MT8173 boards whose playback codec is the audio block of the
  MT6391 PMIC, an MT6397 variant, reached over the SoC's internal ADDA
  interface. Capture, when fitted, comes from a Realtek RT5514 on the I2S
  interface.

properties:
  compatible:
    const: mediatek,mt8173-mt6391

  mediatek,audio-codec:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    description:
      The audio codec node of the PMIC, then, when fitted, the RT5514
      carrying the microphone on I2S.
    minItems: 1
    maxItems: 2

  mediatek,platform:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: The MT8173 audio front end (AFE).

required:
  - compatible
  - mediatek,audio-codec
  - mediatek,platform

additionalProperties: false

examples:
  - |
    sound {
        compatible = "mediatek,mt8173-mt6391";
        mediatek,audio-codec = <&mt6397_codec>, <&rt5514>;
        mediatek,platform = <&afe>;
    };
...
