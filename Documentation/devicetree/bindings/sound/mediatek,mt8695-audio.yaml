%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/mediatek,mt8695-audio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT8695 Audio Front End (AFE)

maintainers:
  - Ryan Brue <ryanbrue.dev@gmail.com>

description:
  The MT8695 AFE moves PCM data between memory and the audio interfaces,
  among them an 8-channel I2S engine wired to the on-chip HDMI
  transmitter. It shares its registers with the audsys clock controller
  and must be a subnode of the mediatek,mt8695-audsys node.

properties:
  compatible:
    const: mediatek,mt8695-audio

  interrupts:
    items:
      - description: AFE interrupt
      - description: ASYS interrupt

  interrupt-names:
    items:
      - const: afe
      - const: asys

  clocks:
    items:
      - description: AFE gate
      - description: AFE interconnect gate
      - description: A1SYS gate, the 48 kHz family
      - description: A2SYS gate, the 44.1 kHz family
      - description: APLL gate
      - description: HDMI output gate
      - description: APLL1 mux, the 48 kHz family root
      - description: APLL2 mux, the 44.1 kHz family root

  clock-names:
    items:
      - const: afe
      - const: afe_conn
      - const: a1sys
      - const: a2sys
      - const: apll
      - const: hdmi
      - const: apll1
      - const: apll2

required:
  - compatible
  - interrupts
  - interrupt-names
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/mediatek,mt8695-clk.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    audio-controller {
        compatible = "mediatek,mt8695-audio";
        interrupts = <GIC_SPI 242 IRQ_TYPE_LEVEL_LOW>,
                     <GIC_SPI 142 IRQ_TYPE_LEVEL_LOW>;
        interrupt-names = "afe", "asys";
        clocks = <&audsys CLK_AUD_AFE>,
                 <&audsys CLK_AUD_AFE_CONN>,
                 <&audsys CLK_AUD_A1SYS>,
                 <&audsys CLK_AUD_A2SYS>,
                 <&audsys CLK_AUD_APLL>,
                 <&audsys CLK_AUD_HDMI>,
                 <&topckgen CLK_TOP_APLL_SEL>,
                 <&topckgen CLK_TOP_APLL2_SEL>;
        clock-names = "afe", "afe_conn", "a1sys", "a2sys",
                      "apll", "hdmi", "apll1", "apll2";
    };
