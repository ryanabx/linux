%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/mediatek,mt6393-regulator.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6393 Regulator

maintainers:
  - Ryan Brue <ryanbrue.dev@gmail.com>

description:
  The MediaTek MT6393 is an I2C power management IC with four step-down
  converters and one low-dropout regulator. Only the first converter, VPROC,
  is adjustable (600 mV to 1.39375 V in 6.25 mV steps); VDDR (1.1 V), VIO18
  (1.8 V), VIO33 (3.3 V) and the VSD LDO (3.3 V) have fixed outputs and can
  only be switched on and off.

properties:
  compatible:
    const: mediatek,mt6393-regulator

  reg:
    description: I2C slave address.
    maxItems: 1

  regulators:
    type: object
    description: List of regulators provided by this controller.

    properties:
      ldo-vsd:
        type: object
        $ref: regulator.yaml#
        unevaluatedProperties: false

    patternProperties:
      "^buck-(vproc|vddr|vio18|vio33)$":
        type: object
        $ref: regulator.yaml#
        unevaluatedProperties: false

    additionalProperties: false

required:
  - compatible
  - reg
  - regulators

additionalProperties: false

examples:
  - |
    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      pmic@60 {
        compatible = "mediatek,mt6393-regulator";
        reg = <0x60>;

        regulators {
          buck-vproc {
            regulator-name = "vproc";
            regulator-min-microvolt = <800000>;
            regulator-max-microvolt = <1100000>;
            regulator-ramp-delay = <5000>;
            regulator-always-on;
          };

          buck-vio18 {
            regulator-name = "vio18";
            regulator-always-on;
          };
        };
      };
    };
...
